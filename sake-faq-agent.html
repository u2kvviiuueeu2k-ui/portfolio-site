<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>蔵内ナレッジアシスタント | 星霜酒造 業務FAQ（デモ）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;700&family=IBM+Plex+Mono:wght@300;400;500&family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f0e8;
    --bg2: #ede7d9;
    --bg3: #e3dcc8;
    --surface: #faf7f2;
    --navy: #1a2744;
    --navy2: #243358;
    --accent: #8b1a1a;
    --accent2: #c4782a;
    --text: #1a1a2e;
    --text2: #5a5a7a;
    --text3: #8a8aaa;
    --border: rgba(26,39,68,0.1);
    --border2: rgba(26,39,68,0.06);
    --shadow: 0 2px 16px rgba(26,39,68,0.08);
    --font-serif: 'Shippori Mincho', serif;
    --font-mono: 'IBM Plex Mono', monospace;
    --font-body: 'Noto Sans JP', sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* 和紙テクスチャ */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(26,39,68,0.008) 2px,
        rgba(26,39,68,0.008) 4px
      );
    pointer-events: none;
    z-index: 0;
  }

  /* ===== HEADER ===== */
  header {
    background: var(--navy);
    padding: 0 24px;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: relative;
    z-index: 10;
    flex-shrink: 0;
  }

  header::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--accent), var(--accent2), var(--accent));
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .header-icon {
    width: 32px;
    height: 32px;
    background: rgba(255,255,255,0.1);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
  }

  .header-title {
    font-family: var(--font-serif);
    font-size: 16px;
    font-weight: 600;
    color: #fff;
    letter-spacing: 0.08em;
  }

  .header-sub {
    font-size: 11px;
    color: rgba(255,255,255,0.45);
    font-family: var(--font-mono);
    letter-spacing: 0.05em;
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .status-badge {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: var(--font-mono);
    font-size: 11px;
    color: rgba(255,255,255,0.5);
    letter-spacing: 0.05em;
  }

  .status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #4ade80;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  /* ===== MAIN LAYOUT ===== */
  .main {
    display: flex;
    flex: 1;
    overflow: hidden;
    position: relative;
    z-index: 1;
  }

  /* ===== SIDEBAR ===== */
  .sidebar {
    width: 260px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    overflow-y: auto;
  }

  .sidebar-section {
    padding: 20px 16px 12px;
    border-bottom: 1px solid var(--border2);
  }

  .sidebar-label {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--text3);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  .category-btn {
    width: 100%;
    text-align: left;
    padding: 10px 12px;
    border: 1px solid transparent;
    border-radius: 6px;
    background: transparent;
    cursor: pointer;
    font-family: var(--font-body);
    font-size: 13px;
    color: var(--text2);
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 4px;
    transition: all 0.15s;
  }

  .category-btn:hover {
    background: var(--bg2);
    color: var(--text);
    border-color: var(--border);
  }

  .category-btn.active {
    background: var(--navy);
    color: #fff;
    border-color: var(--navy);
  }

  .category-icon {
    font-size: 14px;
    flex-shrink: 0;
  }

  .quick-questions {
    padding: 16px;
    border-bottom: 1px solid var(--border2);
  }

  .quick-q-btn {
    width: 100%;
    text-align: left;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: transparent;
    cursor: pointer;
    font-size: 12px;
    color: var(--text2);
    margin-bottom: 6px;
    line-height: 1.5;
    transition: all 0.15s;
    font-family: var(--font-body);
  }

  .quick-q-btn:hover {
    background: var(--bg2);
    border-color: var(--accent2);
    color: var(--text);
  }

  .quick-q-btn::before {
    content: '↗ ';
    color: var(--accent2);
    font-size: 10px;
  }

  /* ===== CHAT AREA ===== */
  .chat-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .messages::-webkit-scrollbar { width: 4px; }
  .messages::-webkit-scrollbar-track { background: transparent; }
  .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  /* Welcome */
  .welcome-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 28px;
    max-width: 560px;
    box-shadow: var(--shadow);
  }

  .welcome-card h2 {
    font-family: var(--font-serif);
    font-size: 20px;
    font-weight: 600;
    color: var(--navy);
    margin-bottom: 10px;
    letter-spacing: 0.05em;
  }

  .welcome-card p {
    font-size: 13px;
    color: var(--text2);
    line-height: 1.8;
    margin-bottom: 16px;
  }

  .coverage-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .coverage-tag {
    font-size: 11px;
    padding: 4px 10px;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 20px;
    color: var(--text2);
    font-family: var(--font-mono);
  }

  /* Message bubbles */
  .message {
    display: flex;
    gap: 12px;
    animation: msgIn 0.25s ease;
  }

  @keyframes msgIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .message.user {
    flex-direction: row-reverse;
  }

  .avatar {
    width: 34px;
    height: 34px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    flex-shrink: 0;
  }

  .avatar.ai {
    background: var(--navy);
    color: #fff;
  }

  .avatar.user-av {
    background: var(--bg3);
    color: var(--text2);
  }

  .bubble {
    max-width: 520px;
    padding: 14px 18px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.8;
  }

  .message.ai .bubble {
    background: var(--surface);
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    color: var(--text);
    border-radius: 4px 12px 12px 12px;
  }

  .message.user .bubble {
    background: var(--navy);
    color: #fff;
    border-radius: 12px 4px 12px 12px;
  }

  .bubble-meta {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--text3);
    margin-top: 6px;
  }

  .message.user .bubble-meta {
    text-align: right;
    color: rgba(255,255,255,0.4);
  }

  /* Source tags */
  .source-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-top: 10px;
  }

  .source-tag {
    font-size: 10px;
    padding: 3px 8px;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 3px;
    color: var(--text3);
    font-family: var(--font-mono);
  }

  /* Typing indicator */
  .typing {
    display: flex;
    gap: 12px;
    align-items: center;
  }

  .typing-dots {
    display: flex;
    gap: 4px;
    padding: 14px 18px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px 12px 12px 12px;
    box-shadow: var(--shadow);
  }

  .typing-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--text3);
    animation: typingBounce 1.2s infinite;
  }

  .typing-dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-dot:nth-child(3) { animation-delay: 0.4s; }

  @keyframes typingBounce {
    0%, 60%, 100% { transform: translateY(0); }
    30% { transform: translateY(-6px); }
  }

  /* ===== INPUT AREA ===== */
  .input-area {
    padding: 16px 24px 20px;
    border-top: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
  }

  .input-wrapper {
    display: flex;
    gap: 10px;
    align-items: flex-end;
    background: var(--bg);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    transition: border 0.2s;
  }

  .input-wrapper:focus-within {
    border-color: var(--navy2);
    box-shadow: 0 0 0 3px rgba(26,39,68,0.06);
  }

  #userInput {
    flex: 1;
    border: none;
    background: transparent;
    font-family: var(--font-body);
    font-size: 14px;
    color: var(--text);
    resize: none;
    outline: none;
    max-height: 120px;
    line-height: 1.6;
  }

  #userInput::placeholder { color: var(--text3); }

  .send-btn {
    width: 36px;
    height: 36px;
    border-radius: 8px;
    background: var(--navy);
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.15s;
    color: #fff;
    font-size: 14px;
  }

  .send-btn:hover { background: var(--navy2); transform: translateY(-1px); }
  .send-btn:disabled { background: var(--bg3); cursor: not-allowed; transform: none; }

  .input-hint {
    font-size: 11px;
    color: var(--text3);
    font-family: var(--font-mono);
    margin-top: 8px;
    text-align: center;
  }

  /* ===== SCROLLBAR ===== */
  .sidebar::-webkit-scrollbar { width: 3px; }
  .sidebar::-webkit-scrollbar-thumb { background: var(--border); }

  /* ===== RESPONSIVE ===== */
  @media (max-width: 640px) {
    .sidebar { display: none; }
    .demo-badge { display: none; }
  }
</style>
</head>
<body>

<!-- HEADER -->
<header>
  <div class="header-left">
    <div class="header-icon">🍶</div>
    <div>
      <div class="header-title">蔵内ナレッジアシスタント</div>
      <div class="header-sub">業務FAQ自動対応エージェント — 酒造・食品製造業Ver</div>
    </div>
  </div>
  <div class="header-right">
    <div class="status-badge demo-badge" style="color: rgba(255,255,255,0.4);">デモ／サンプルデータ（架空の蔵元）</div>
    <div class="status-badge">
      <div class="status-dot"></div>
      AI稼働中
    </div>
  </div>
</header>

<div class="main">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-label">カテゴリ</div>
      <button class="category-btn active" onclick="setCategory('all')">
        <span class="category-icon">📋</span>すべて
      </button>
      <button class="category-btn" onclick="setCategory('manual')">
        <span class="category-icon">📄</span>手順書・規格書
      </button>
      <button class="category-btn" onclick="setCategory('order')">
        <span class="category-icon">📦</span>原料・発注先
      </button>
      <button class="category-btn" onclick="setCategory('quality')">
        <span class="category-icon">⚠️</span>品質異常・初動
      </button>
    </div>

    <div class="quick-questions" id="quickQuestions">
      <div class="sidebar-label">よくある質問</div>
      <!-- JS で動的生成 -->
    </div>
  </aside>

  <!-- CHAT -->
  <div class="chat-area">
    <div class="messages" id="messages">

      <!-- Welcome -->
      <div class="welcome-card">
        <h2>🍶 蔵内ナレッジアシスタント</h2>
        <p>
          製造現場でよく聞かれる質問に、AIがすぐに答えます。<br>
          手順書の場所・発注先・品質異常時の初動など、<br>
          担当者に聞く前にまずここで確認してみてください。
        </p>
        <div class="coverage-tags">
          <span class="coverage-tag">手順書検索</span>
          <span class="coverage-tag">発注先照会</span>
          <span class="coverage-tag">品質異常対応</span>
          <span class="coverage-tag">ロット管理</span>
          <span class="coverage-tag">洗浄・衛生ルール</span>
          <span class="coverage-tag">設備トラブル</span>
        </div>
      </div>

    </div>

    <!-- INPUT -->
    <div class="input-area">
      <div class="input-wrapper">
        <textarea id="userInput" rows="1" placeholder="例：火入れの手順書はどこにありますか？" oninput="autoResize(this)" onkeydown="handleKey(event)"></textarea>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()">↑</button>
      </div>
      <div class="input-hint">Enter で送信 / Shift+Enter で改行 — 業種に合わせてFAQデータを差し替え可能</div>
    </div>
  </div>

</div>

// 全FAQをフラット化
const ALL_FAQ = [...FAQ_DB.manual, ...FAQ_DB.order, ...FAQ_DB.quality];

// クイック質問データ

  all: [
    "火入れの手順書はどこですか？",
    "麹の仕入先を教えてください",
    "異物を発見しました。どうすればいいですか？",
    "製造日報の様式はどれですか？",
    "賞味期限近い原料の使用ルールは？"
  ],
  manual: [
    "火入れの標準条件を教えてください",
    "CIP洗浄の条件表はどこですか？",
    "充填手順の最新版はどれですか？",
    "製造日報はどこに保存しますか？",
    "酒母工程の基準値を教えてください"
  ],
  order: [
    "麹菌の仕入先はどこですか？",
    "瓶とラベルの発注先は違いますか？",
    "酒米の発注先・担当者を教えてください",
    "副原料の発注先はどこですか？",
    "設備の修理連絡先を教えてください"
  ],
  quality: [
    "異物を発見したときの手順は？",
    "品質異常の報告先を教えてください",
    "色ブレが出た場合の対応は？",
    "先入先出のルールを教えてください",
    "設備エラーが出たときの初動は？"
  ]
};

let currentCategory = 'all';

// カテゴリ切り替え
function setCategory(cat) {
  currentCategory = cat;
  document.querySelectorAll('.category-btn').forEach(btn => btn.classList.remove('active'));
  event.currentTarget.classList.add('active');
  renderQuickQuestions(cat);
}

// クイック質問を描画
function renderQuickQuestions(cat) {
  const container = document.getElementById('quickQuestions');
  const qs = QUICK_QUESTIONS[cat] || QUICK_QUESTIONS.all;
  container.innerHTML = '<div class="sidebar-label">よくある質問</div>' +
    qs.map(q => `<button class="quick-q-btn" onclick="quickAsk('${q.replace(/'/g, "\\'")}')">${q}</button>`).join('');
}

function quickAsk(q) {
  document.getElementById('userInput').value = q;
  sendMessage();
}

// メッセージ送信
async function sendMessage() {
  const input = document.getElementById('userInput');
  const msg = input.value.trim();
  if (!msg) return;

  input.value = '';
  input.style.height = 'auto';
  document.getElementById('sendBtn').disabled = true;

  // ユーザーメッセージ表示
  appendMessage('user', msg);

  // タイピングインジケーター
  const typingId = showTyping();

  try {
    const reply = await callClaude(msg);
    removeTyping(typingId);
    appendAIMessage(reply, msg);
  } catch (e) {
    removeTyping(typingId);
    appendAIMessage(generateLocalAnswer(msg), msg);
  }

  document.getElementById('sendBtn').disabled = false;
}

// Claude API呼び出し
async function callClaude(userMsg) {
  const systemPrompt = `あなたは酒造・食品製造業向けの社内ナレッジアシスタントです。
以下のFAQデータベースをもとに、現場スタッフの質問に答えてください。

【FAQデータベース】
${JSON.stringify(ALL_FAQ, null, 2)}

【回答ルール】
- 該当するFAQがある場合：場所・担当者・手順を具体的に答える
- 手順がある場合：番号付きリストで分かりやすく
- 「問い合わせ先」がある場合は必ず記載
- 不明な場合：「このご質問は担当者への確認が必要です。品質保証部（内線XX）または製造主任にお問い合わせください」と答える
- 回答は簡潔に。200字以内を目安に
- 絵文字は使わない（業務用なので）
- 敬語・丁寧語で回答`;

  const res = await fetch("/api/faq", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      system: systemPrompt,
      messages: [{ role: "user", content: userMsg }]
    })
  });

  if (!res.ok) throw new Error(`API error: ${res.status}`);

  const data = await res.json();
  return data.content?.[0]?.text || "回答を生成できませんでした。";
}

// ローカルフォールバック（API不可時）
function generateLocalAnswer(msg) {
  const lower = msg.toLowerCase();
  for (const item of ALL_FAQ) {
    const keywords = item.q.toLowerCase().split(/[・。、\s]+/);
    if (keywords.some(k => k.length > 2 && lower.includes(k))) {
      let answer = '';
      if (item.location) answer += `📁 場所：${item.location}\n\n`;
      if (item.supplier) answer += `🏢 発注先：${item.supplier}\n連絡先：${item.contact}\n\n`;
      if (item.steps) answer += `手順：\n${item.steps.join('\n')}\n\n`;
      if (item.detail) answer += item.detail;
      return answer || item.detail;
    }
  }
  return "このご質問は担当者への確認が必要です。品質保証部（内線XX）または製造主任にお問い合わせください。\n\n※ デモ版のため、FAQに登録されていない質問はシステムが回答できない場合があります。";
}

// メッセージ追加
function appendMessage(role, text) {
  const messages = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = `message ${role}`;
  const now = new Date().toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });

  if (role === 'user') {
    div.innerHTML = `
      <div class="avatar user-av">👤</div>
      <div>
        <div class="bubble">${escapeHtml(text)}</div>
        <div class="bubble-meta">${now}</div>
      </div>`;
  }
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
}

function appendAIMessage(text, userMsg) {
  const messages = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'message ai';
  const now = new Date().toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });

  // 関連ソースを探す
  const sources = findSources(userMsg);

  div.innerHTML = `
    <div class="avatar ai">🍶</div>
    <div>
      <div class="bubble">${formatAnswer(text)}</div>
      ${sources.length ? `<div class="source-tags">${sources.map(s => `<span class="source-tag">📂 ${s}</span>`).join('')}</div>` : ''}
      <div class="bubble-meta">${now} — AI回答（業種別FAQデータ参照）</div>
    </div>`;

  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
}

function findSources(msg) {
  const lower = msg.toLowerCase();
  const sources = new Set();
  for (const item of ALL_FAQ) {
    const keywords = item.q.toLowerCase().split(/[・。、\s]+/);
    if (keywords.some(k => k.length > 2 && lower.includes(k))) {
      if (item.source) sources.add(item.source);
    }
  }
  return [...sources].slice(0, 2);
}

function formatAnswer(text) {
  return escapeHtml(text)
    .replace(/\n/g, '<br>')
    .replace(/①|②|③|④|⑤/g, m => `<strong>${m}</strong>`);
}

function escapeHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// タイピング表示
function showTyping() {
  const messages = document.getElementById('messages');
  const id = 'typing-' + Date.now();
  const div = document.createElement('div');
  div.className = 'typing';
  div.id = id;
  div.innerHTML = `
    <div class="avatar ai">🍶</div>
    <div class="typing-dots">
      <div class="typing-dot"></div>
      <div class="typing-dot"></div>
      <div class="typing-dot"></div>
    </div>`;
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
  return id;
}

function removeTyping(id) {
  const el = document.getElementById(id);
  if (el) el.remove();
}

// テキストエリア自動リサイズ
function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

// Enter送信
function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

// 初期化
renderQuickQuestions('all');
</script>
